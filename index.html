<!doctype html>
<!--
  Cook gestures: hand-swipe detection for the Cooking App (CLAUDE.md §13).

  Runs inside a WebView in cooking mode. It reads the front camera, finds one
  hand with ml5.js handPose, and detects a horizontal swipe of the palm.
  It only sends small JSON messages to the app ("ready", "status", "gesture",
  "error"). Camera images never leave this page.

  Open with ?debug=1 to see the fps and a dot on the palm centre.
  Must be served over https (getUserMedia only works in a secure context).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Cook gestures</title>
    <style>
      /* Colours from the app's style guide (§12.1): text and highlight. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2f3a2e;
      }
      /* Mirrored like a selfie camera, so moving your hand left moves it left on screen. */
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      video {
        transform: scaleX(-1);
      }
      #debug {
        position: absolute;
        left: 4px;
        top: 4px;
        font: 600 12px/16px system-ui, sans-serif;
        color: #2f3a2e;
        background: #ffa015;
        border-radius: 8px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="overlay" hidden></canvas>
    <div id="debug" hidden></div>

    <!-- Pinned version (§13.2). When you change it, also change ML5_VERSION below. -->
    <script src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js"></script>
    <script>
      (function () {
        "use strict";

        var ML5_VERSION = "1.4.0";

        // All tunable values in one place (§13.7). The app can change them with a
        // "config" message. Positions are fractions of the image (0–1).
        var config = {
          minConfidence: 0.7, // ignore hands the model isn't sure about
          minHandSize: 0.18, // wrist → middle finger base, as a share of the image height
          historyMs: 600, // how long palm positions are kept
          minTravel: 0.35, // horizontal movement needed for a swipe
          minDurationMs: 150, // a swipe takes at least this long…
          maxDurationMs: 600, // …and at most this long
          maxVerticalRatio: 0.6, // vertical movement must stay below this share of the horizontal
          cooldownMs: 1000, // ignore everything after a swipe
          lostHandMs: 300, // no hand for this long clears the history
          // Which way is "next". "left" = swipe from right to left, like turning a page.
          // Check on a real phone: the image is mirrored (§13.7 step 4).
          nextDirection: "left",
        };

        var isDebug = new URLSearchParams(window.location.search).get("debug") === "1";
        var video = document.getElementById("video");
        var overlay = document.getElementById("overlay");
        var debugLabel = document.getElementById("debug");

        var handPose = null;
        var stream = null;
        var isRunning = false;

        // Palm positions of the last historyMs: { x, y, t }.
        var history = [];
        var cooldownUntil = 0;
        var lastHandAt = 0;

        // Counted per second for the "status" message.
        var framesThisSecond = 0;
        var handSeenThisSecond = false;

        // ── Messages to the app ────────────────────────────────────────────

        function send(message) {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify(message));
          } else if (isDebug) {
            console.log("[cook-gestures]", message);
          }
        }

        function sendError(code, error) {
          var text = error && error.message ? error.message : String(error);
          send({ type: "error", code: code, message: text.slice(0, 200) });
        }

        // ── Camera ─────────────────────────────────────────────────────────

        function startCamera() {
          return navigator.mediaDevices
            .getUserMedia({
              video: { facingMode: "user", width: 320, height: 240 },
              audio: false,
            })
            .then(function (newStream) {
              stream = newStream;
              video.srcObject = stream;
              return video.play();
            });
        }

        // Stops every track, so the camera light goes off (§13.8).
        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach(function (track) {
              track.stop();
            });
            stream = null;
          }
          video.srcObject = null;
        }

        function start() {
          if (isRunning || !handPose) {
            return Promise.resolve();
          }
          return startCamera().then(
            function () {
              isRunning = true;
              history = [];
              handPose.detectStart(video, onHands);
            },
            function (error) {
              var isDenied = error && (error.name === "NotAllowedError" || error.name === "SecurityError");
              sendError(isDenied ? "camera_denied" : "camera_failed", error);
            }
          );
        }

        function pause() {
          if (!isRunning) {
            return;
          }
          isRunning = false;
          handPose.detectStop();
          stopCamera();
          history = [];
        }

        // ── Hand tracking and swipe detection (§13.7) ──────────────────────

        // Palm centre: average of the wrist and the four finger-base knuckles.
        var PALM_POINTS = [
          "wrist",
          "index_finger_mcp",
          "middle_finger_mcp",
          "ring_finger_mcp",
          "pinky_finger_mcp",
        ];

        function bestHand(hands) {
          var best = null;
          for (var i = 0; i < hands.length; i++) {
            if (best === null || hands[i].confidence > best.confidence) {
              best = hands[i];
            }
          }
          return best;
        }

        function onHands(hands) {
          if (!isRunning) {
            return;
          }
          framesThisSecond++;
          var now = performance.now();
          var width = video.videoWidth;
          var height = video.videoHeight;
          var hand = bestHand(hands);
          var palm = null;

          if (hand && width > 0 && height > 0 && hand.confidence >= config.minConfidence) {
            var handSize =
              Math.hypot(hand.middle_finger_mcp.x - hand.wrist.x, hand.middle_finger_mcp.y - hand.wrist.y) /
              height;
            // Small hands are far away: probably someone in the background.
            if (handSize >= config.minHandSize) {
              var sumX = 0;
              var sumY = 0;
              for (var i = 0; i < PALM_POINTS.length; i++) {
                sumX += hand[PALM_POINTS[i]].x;
                sumY += hand[PALM_POINTS[i]].y;
              }
              palm = { x: sumX / PALM_POINTS.length / width, y: sumY / PALM_POINTS.length / height, t: now };
            }
          }

          if (isDebug) {
            drawDebug(palm);
          }

          if (palm === null) {
            if (now - lastHandAt >= config.lostHandMs) {
              history = [];
            }
            return;
          }
          lastHandAt = now;
          handSeenThisSecond = true;

          if (now < cooldownUntil) {
            return;
          }

          history.push(palm);
          while (history.length > 0 && now - history[0].t > config.historyMs) {
            history.shift();
          }
          checkForSwipe(now);
        }

        // Compares the newest palm position with each earlier one in the history.
        // Not only the oldest: the hand often rests for a moment before it swipes,
        // and then the oldest point isn't where the swipe started.
        function checkForSwipe(now) {
          var newest = history[history.length - 1];
          var dx = 0;
          var found = false;
          for (var i = 0; i < history.length - 1; i++) {
            var start = history[i];
            var duration = newest.t - start.t;
            if (duration < config.minDurationMs || duration > config.maxDurationMs) {
              continue;
            }
            dx = newest.x - start.x;
            var dy = newest.y - start.y;
            if (Math.abs(dx) < config.minTravel) {
              continue;
            }
            if (Math.abs(dy) > config.maxVerticalRatio * Math.abs(dx)) {
              continue;
            }
            found = true;
            break;
          }
          if (!found) {
            return;
          }

          var movedLeft = dx < 0;
          var isNext = movedLeft === (config.nextDirection === "left");
          send({ type: "gesture", dir: isNext ? "next" : "prev" });
          history = [];
          cooldownUntil = now + config.cooldownMs;
        }

        // ── Status (about once a second, §13.5) ────────────────────────────

        setInterval(function () {
          send({ type: "status", fps: framesThisSecond, hand: handSeenThisSecond, running: isRunning });
          if (isDebug) {
            debugLabel.textContent = framesThisSecond + " fps" + (handSeenThisSecond ? " · hand" : "");
          }
          framesThisSecond = 0;
          handSeenThisSecond = false;
        }, 1000);

        // ── Debug overlay (?debug=1) ───────────────────────────────────────

        function drawDebug(palm) {
          var context = overlay.getContext("2d");
          overlay.width = overlay.clientWidth;
          overlay.height = overlay.clientHeight;
          context.clearRect(0, 0, overlay.width, overlay.height);
          if (palm === null) {
            return;
          }
          // The keypoints are already mirrored (flipped: true), like the video.
          context.fillStyle = "#ffa015";
          context.beginPath();
          context.arc(palm.x * overlay.width, palm.y * overlay.height, 8, 0, Math.PI * 2);
          context.fill();
        }

        // ── Messages from the app (§13.5) ──────────────────────────────────

        window.cookGestures = {
          handle: function (message) {
            if (!message || typeof message.type !== "string") {
              return;
            }
            if (message.type === "pause") {
              pause();
            } else if (message.type === "resume") {
              start();
            } else if (message.type === "config" && message.values && typeof message.values === "object") {
              // Only known settings, with the same type as the default.
              Object.keys(config).forEach(function (key) {
                if (typeof message.values[key] === typeof config[key]) {
                  config[key] = message.values[key];
                }
              });
            }
          },
        };

        // Also stop when the page itself is hidden.
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            pause();
          }
        });

        // ── Start ──────────────────────────────────────────────────────────

        function init() {
          if (isDebug) {
            overlay.hidden = false;
            debugLabel.hidden = false;
          }
          if (!window.ml5) {
            sendError("model_failed", "ml5.js did not load (no internet?)");
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            sendError("camera_failed", "getUserMedia is not available here");
            return;
          }

          // lite model, one hand: lighter on the battery (§13.10).
          // Works whether ml5.handPose returns the model or a promise of it.
          Promise.resolve(ml5.handPose({ maxHands: 1, flipped: true, modelType: "lite" }))
            .then(function (model) {
              handPose = model;
              return model.ready;
            })
            .then(
              function () {
                send({ type: "ready", ml5Version: ML5_VERSION });
                return start();
              },
              function (error) {
                sendError("model_failed", error);
              }
            )
            .catch(function (error) {
              sendError("unknown", error);
            });
        }

        init();
      })();
    </script>
  </body>
</html>
